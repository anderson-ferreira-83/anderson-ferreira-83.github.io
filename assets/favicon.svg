<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AF logo favicon">
  <defs>
    <linearGradient id="ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#74b9ff"/>
      <stop offset="1" stop-color="#3f95ff"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="18" fill="#020406"/>
  <circle cx="32" cy="32" r="27.5" fill="#020406" stroke="url(#ring)" stroke-width="1.7"/>

  <path
    d="M7 34c4.5-3.6 9-3.6 13.5 0s9 3.6 13.5 0 9-3.6 13.5 0 9 3.6 13.5 0"
    fill="none"
    stroke="#f5f8fb"
    stroke-width="1.8"
    stroke-linecap="round"
    filter="url(#soft-glow)"
    opacity="0.95"
  />
  <path
    d="M7 33c4.5 2.2 9 2.2 13.5 0s9-2.2 13.5 0 9 2.2 13.5 0 9-2.2 13.5 0"
    fill="none"
    stroke="#37b6ff"
    stroke-width="1"
    stroke-linecap="round"
    opacity="0.7"
  />

  <g fill="#f8f8f8">
    <text x="18" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-style="italic">A</text>
    <text x="29" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="28">F</text>
  </g>

  <circle cx="54.5" cy="34" r="1.7" fill="#3fb8ff"/>
</svg>
